# Prüft die Bibliothek bei jedem Push/PR.
# Bei einem Tag "vX.Y.Z" wird zusätzlich ein GitHub-Release mit den ZIP-Dateien angelegt.
# Ablauf für Maintainer: docs/release.md

name: Bibliothek prüfen und veröffentlichen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prüfen und Release-Dateien bauen
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Tag "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

      - name: Release-Dateien als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: release-dateien
          path: dist/

      - name: GitHub-Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/spstiger-free-DTools-components.zip `
            dist/spstiger-Bibliothek-Updater.zip `
            --title "spstiger DTools-Komponenten ${{ github.ref_name }}" `
            --notes-file dist/release-notes.md
